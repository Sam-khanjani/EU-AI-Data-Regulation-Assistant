# Everything shares one image; the command decides what a container does.
#
#   docker compose up -d --build                        database + migrations + chat + admin
#   docker compose --profile tools run --rm ingest      fetch, parse, embed the corpus
#
# See "Running with Docker" in README.md.

x-app-env: &app-env
  # Inside the compose network the database is `db:5432`. The DATABASE_URL in .env points at
  # 127.0.0.1:5433 -- the host-side port mapping, which a container cannot reach -- so it is
  # overridden here. POSTGRES_PASSWORD must be URL-safe (or percent-encoded) to embed.
  DATABASE_URL: postgresql+psycopg://euaia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/euaia

x-app: &app
  build:
    context: .
    args:
      # Leave false for the hosted reranker (the default in config.py). Set LOCAL_RERANK=true
      # in .env and rebuild when switching rerank_provider to "local": torch and the
      # cross-encoder are only installed then.
      LOCAL_RERANK: ${LOCAL_RERANK:-false}
  image: euaia-app
  env_file: .env
  environment:
    <<: *app-env
  volumes:
    - euaia-models:/models      # reranker weights, downloaded once
    - euaia-raw:/app/data/raw   # source PDFs fetched from CELLAR

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: euaia-db
    environment:
      POSTGRES_USER: euaia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: euaia
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - euaia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euaia -d euaia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. The app waits for it to succeed, so it never serves against a
  # schema older than its code.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # The chat: Chainlit on 8001.
  chat:
    <<: *app
    container_name: euaia-chat
    command: ["python", "-m", "euaia.chat", "--host", "0.0.0.0"]
    environment:
      <<: *app-env
      # Required, not just passed through from .env: without them nobody can sign in, and
      # failing at `up` says so more clearly than a login page that refuses everyone.
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:?set CHAINLIT_AUTH_SECRET in .env}
      CHAT_USERS: ${CHAT_USERS:?set CHAT_USERS in .env}
      CHAT_URL: http://127.0.0.1:8001
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8001/', timeout=5).status != 200)"
      interval: 15s
      timeout: 10s
      retries: 5
      # With the local reranker, the first start downloads its weights before serving.
      start_period: 15m

  # The admin dashboard (/status), plus /api/ask for the evaluation harness, on 8000.
  app:
    <<: *app
    container_name: euaia-app
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status != 200)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # On demand only (`--profile tools`): a one-shot job, not a service that should stay up.
  # Downloads the whole corpus into the shared raw volume -- the Act from EUR-Lex and the
  # Commission's guidelines, codes of practice and Q&A. Run it before `ingest`, which then
  # indexes everything in one pass. Separate because it needs no database and spends no
  # embedding quota.
  fetch-docs:
    <<: *app
    entrypoint: ["python", "-m", "euaia.ingest.ec_documents"]
    command: []
    profiles: ["tools"]
    restart: "no"

  ingest:
    <<: *app
    # entrypoint, not command: arguments given to `docker compose run` replace `command`, so
    # this lets `run --rm ingest --skip-embeddings` append flags to the pipeline.
    entrypoint: ["python", "-m", "euaia.ingest.pipeline"]
    command: []
    profiles: ["tools"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  euaia-pgdata:
  euaia-models:
  euaia-raw:
