services:
  db:
    image: pgvector/pgvector:pg17
    container_name: euaia-db
    environment:
      POSTGRES_USER: euaia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: euaia
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - euaia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euaia -d euaia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  euaia-pgdata:
