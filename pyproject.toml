[project]
name = "euaia"
version = "0.1.0"
description = "Trustworthy RAG assistant for the EU AI Act, with verified citations and document version tracking"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    # chat interface (python -m euaia.chat); asyncpg is its saved-history driver, because
    # psycopg cannot run async on the event loop Chainlit gets on Windows
    "chainlit>=2.12.0",
    "asyncpg>=0.30",
    # persistence
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    # config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # ingestion
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "tenacity>=9.0",
    # models
    "groq>=0.13",
    "google-genai>=0.3",
    # graph
    "langgraph>=0.2.50",
    # utilities
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "langfuse>=4.15",
    "langchain>=1.4.2",
]

[project.optional-dependencies]
# Only for rerank_provider = "local". The hosted reranker is the default and needs none of
# this, and torch is most of the install -- so it is opt-in rather than paid on every build.
local-rerank = [
    # cross-encoder, runs on CPU, no API quota
    "sentence-transformers>=3.3",
    # Declared directly only so [tool.uv.sources] below can route it: uv applies sources
    # to direct dependencies, and torch otherwise arrives transitively.
    "torch>=2.5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euaia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures hold verbatim legal text; rewrapping it would change the strings under test.
"tests/*" = ["E501"]
"eval/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
pythonpath = ["src"]

# Linux (i.e. the Docker image) gets CPU-only torch. PyPI's Linux torch wheel depends on the
# full CUDA stack -- several GB of nvidia-* libraries that do nothing without a GPU. Windows
# and macOS wheels on PyPI are already CPU builds, so they are left alone.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
