{# One verified citation. `cite` is a service.Citation. #}
<figure class="citation">
  <blockquote>{{ cite.quote }}</blockquote>
  <figcaption>
    {% if cite.deeplink %}
      <a href="{{ cite.deeplink }}" target="_blank" rel="noopener">{{ cite.citation_label }}</a>
    {% else %}
      {{ cite.citation_label }}
    {% endif %}
    {% if cite.version_label %}<span class="muted">&middot; {{ cite.version_label }}</span>{% endif %}
    <span class="pill good" title="This text was found verbatim in the source">verified</span>
  </figcaption>
</figure>
