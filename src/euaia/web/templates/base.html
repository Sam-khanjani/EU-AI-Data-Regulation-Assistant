<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EU AI Act Assistant{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <a class="brand" href="/status">
        <strong>EU AI Act Assistant</strong>
        <span class="tag">admin</span>
      </a>
      <nav>
        <a href="/status">Corpus</a>
        <a href="/monitor">Monitor</a>
        <a href="{{ chat_url }}">Open the chat</a>
      </nav>
    </div>
  </header>

  <main class="wrap {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap">
    <p>
      Administration for the EU AI Act Assistant. Questions are asked in the chat, where every
      quote is checked against the official EUR-Lex text.
    </p>
  </footer>
</body>
</html>
